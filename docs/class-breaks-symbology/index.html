<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="description" content="Canvas Flowmap Layer with LeafletJS — Class Breaks Symbology." />

  <title>Canvas Flowmap Layer with LeafletJS — Class Breaks Symbology</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <script type="importmap">
  {
    "imports": {
      "leaflet": "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js"
    }
  }
  </script>

  <style>
    body {
      margin: 0;
      padding: 0;
    }

    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      right: 0;
      left: 0;
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <script type="module">
    import { Map as LeafletMap, TileLayer } from 'leaflet';
    import { CanvasFlowmapLayer } from '../../dist/canvas-flowmap-layer.js';
    import Papa from 'https://esm.sh/papaparse@5';

    const map = new LeafletMap('map').setView([0, 0], 2);
    new TileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 20
    }).addTo(map);

    Papa.parse('../csv-data/Flowmap_Cities_one_to_many.csv', {
      download: true,
      header: true,
      dynamicTyping: true,
      skipEmptyLines: true,
      complete: function(results) {
        const geoJsonFeatureCollection = {
          type: 'FeatureCollection',
          features: results.data.map(function(datum) {
            return {
              type: 'Feature',
              geometry: {
                type: 'Point',
                coordinates: [datum.s_lon, datum.s_lat]
              },
              properties: datum
            };
          })
        };

        const oneToManyFlowmapLayer = new CanvasFlowmapLayer(geoJsonFeatureCollection, {
          originAndDestinationFieldIds: {
            originUniqueIdField: 's_city_id',
            originGeometry: { x: 's_lon', y: 's_lat' },
            destinationUniqueIdField: 'e_city_id',
            destinationGeometry: { x: 'e_lon', y: 'e_lat' }
          },
          canvasBezierStyle: {
            type: 'classBreaks',
            field: 's_Volume',
            classBreakInfos: [
              {
                classMinValue: 0,
                classMaxValue: 999999,
                symbol: {
                  strokeStyle: '#e7e1ef',
                  lineWidth: 0.5,
                  lineCap: 'round',
                  shadowColor: '#e7e1ef',
                  shadowBlur: 1.5
                }
              },
              {
                classMinValue: 1000000,
                classMaxValue: 4999999,
                symbol: {
                  strokeStyle: '#c994c7',
                  lineWidth: 1.5,
                  lineCap: 'round',
                  shadowColor: '#c994c7',
                  shadowBlur: 1.5
                }
              },
              {
                classMinValue: 5000000,
                classMaxValue: 10000000,
                symbol: {
                  strokeStyle: '#dd1c77',
                  lineWidth: 3,
                  lineCap: 'round',
                  shadowColor: '#dd1c77',
                  shadowBlur: 1.5
                }
              }
            ],
            // the layer will use the defaultSymbol if a data value doesn't fit any classBreak
            defaultSymbol: {
              strokeStyle: '#e7e1ef',
              lineWidth: 0.5,
              lineCap: 'round',
              shadowColor: '#e7e1ef',
              shadowBlur: 1.5
            }
          },
          pathDisplayMode: 'selection',
          animationStarted: false
        }).addTo(map);

        oneToManyFlowmapLayer.on('click', function(e) {
          if (e.sharedOriginFeatures.length) {
            oneToManyFlowmapLayer.selectFeaturesForPathDisplay(e.sharedOriginFeatures, 'SELECTION_NEW');
          }
          if (e.sharedDestinationFeatures.length) {
            oneToManyFlowmapLayer.selectFeaturesForPathDisplay(e.sharedDestinationFeatures, 'SELECTION_NEW');
          }
        });

        oneToManyFlowmapLayer.selectFeaturesForPathDisplayById('s_city_id', 562, true, 'SELECTION_NEW');
        oneToManyFlowmapLayer.selectFeaturesForPathDisplayById('s_city_id', 657, true, 'SELECTION_ADD');
        oneToManyFlowmapLayer.selectFeaturesForPathDisplayById('s_city_id', 516, true, 'SELECTION_ADD');
      }
    });
  </script>

</body>

</html>
